[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cursorswap"
dynamic = ["version"]
description = "Multi-account switcher for Cursor CLI and Cursor.app on macOS"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.scripts]
cursorswap = "cursorswap.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.version]
path = "src/cursorswap/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
